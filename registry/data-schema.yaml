entities:
  Site:
    id: int (PK)
    name: str (UNIQUE)
    base_url: str
    enabled: bool
    sort: int
    categories: JSON | null
    auto_disabled_at: datetime | null
    created_at: datetime

  Favorite:
    id: int (PK)
    title: str
    year: int | null
    poster_url: str | null
    created_at: datetime
    UNIQUE(title, year)

  PlayProgress:
    id: int (PK)
    title: str
    year: int | null
    source_site_id: int (FK → Site.id)
    source_video_id: str
    episode_index: int
    episode_name: str
    position_seconds: int
    duration_seconds: int | null
    updated_at: datetime
    UNIQUE(title, year)

  DownloadTask:
    id: int (PK)
    title: str
    episode_index: int
    episode_name: str
    source_site_id: int (FK → Site.id)
    source_video_id: str
    url: str
    suffix: str
    file_path: str
    total_bytes: int | null
    downloaded_bytes: int
    total_segments: int | null
    downloaded_segments: int
    status: str (queued | downloading | paused | done | error)
    error: str | null
    created_at: datetime
    updated_at: datetime

  VideoCache:
    id: int (PK)
    site_id: int (FK → Site.id)
    original_id: str
    title: str
    year: int | null
    poster_url: str | null
    intro: str | null
    area: str | null
    actors: str | null
    director: str | null
    play_url_raw: str | null
    source_updated_at: str | null
    cached_at: datetime
    UNIQUE(site_id, original_id)
    INDEX(title, year)

  AppConfig:
    key: str (PK)
    value: str
    updated_at: datetime
