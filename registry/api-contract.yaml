endpoints:
  # Sites
  - method: GET
    path: /api/sites
    response: list[Site]

  - method: POST
    path: /api/sites
    body: SiteCreate
    response: Site

  - method: PATCH
    path: /api/sites/{site_id}
    body: SiteUpdate
    response: Site

  - method: DELETE
    path: /api/sites/{site_id}
    response: None

  - method: POST
    path: /api/sites/{site_id}/probe
    response: ProbeResult

  - method: GET
    path: /api/sites/{site_id}/categories
    response: list[Category]

  - method: PUT
    path: /api/sites/{site_id}/categories
    body: list[CategoryMapping]
    response: None

  - method: POST
    path: /api/sites/{site_id}/fetch-categories
    response: list[Category]

  # Videos
  - method: GET
    path: /api/videos
    query: t, pg, h, by, category, mode
    response: AggregatedListResponse

  - method: GET
    path: /api/videos/search
    query: wd, pg, category, mode
    response: AggregatedListResponse

  - method: POST
    path: /api/videos/detail
    body: DetailRequest
    response: DetailResponse

  - method: DELETE
    path: /api/videos/cache
    response: {deleted: int}

  # Play
  - method: GET
    path: /api/play/episodes
    query: site_id, original_id
    response: list[Episode]

  # Downloads
  - method: GET
    path: /api/downloads
    response: list[DownloadTask]

  - method: POST
    path: /api/downloads
    body: DownloadTaskCreate
    response: DownloadTask

  - method: POST
    path: /api/downloads/{task_id}/pause
    response: DownloadTask

  - method: POST
    path: /api/downloads/{task_id}/resume
    response: DownloadTask

  - method: DELETE
    path: /api/downloads/{task_id}
    query: delete_file
    response: {ok: bool, file_deleted?: bool, file_error?: str}

  # Progress
  - method: POST
    path: /api/progress
    body: PlayProgress
    response: PlayProgress

  - method: GET
    path: /api/progress/recent
    response: list[PlayProgress]

  - method: GET
    path: /api/progress
    query: title, year
    response: PlayProgress | None

  # Favorites
  - method: GET
    path: /api/favorites
    response: list[Favorite]

  - method: POST
    path: /api/favorites
    body: FavoriteCreate
    response: Favorite

  - method: DELETE
    path: /api/favorites/{fav_id}
    response: None

  # Settings
  - method: GET
    path: /api/settings/download-root
    response: {download_root: str | None}

  - method: PUT
    path: /api/settings/download-root
    body: {download_root: str}
    response: {download_root: str}

  # SSE
  - method: GET
    path: /api/sse
    response: text/event-stream
    events:
      - download_progress
      - download_status
      - site_health
