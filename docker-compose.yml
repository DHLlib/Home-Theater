version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: ht-postgres
    environment:
      POSTGRES_USER: home_theater
      POSTGRES_PASSWORD: home_theater_pass
      POSTGRES_DB: home_theater
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home_theater -d home_theater"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ht-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://home_theater:home_theater_pass@db:5432/home_theater
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: INFO
      DEFAULT_DOWNLOAD_ROOT: /downloads
    ports:
      - "8000:8000"
    volumes:
      - downloads:/downloads
      - logs:/app/logs
    restart: unless-stopped

volumes:
  pgdata:
  downloads:
  logs:
