# API 契约（Reverse 模式 — 已有项目逆向验证）
# 版本: 1.0
# 技术栈: FastAPI + React

version: "1.0"
project: Home Theater

endpoints:
  # ═══════════════════════════════════════════════════════════════
  # 站点管理 (AC-001, AC-002)
  # ═══════════════════════════════════════════════════════════════
  - id: API-SITE-LIST
    path: /api/sites
    method: GET
    summary: 列出所有采集站
    request_schema: null
    response_schema: Site[]
    consumers: [AC-001, AC-002]
    notes: 按 sort, id 排序

  - id: API-SITE-CREATE
    path: /api/sites
    method: POST
    summary: 新建采集站
    request_schema: SiteCreate
    response_schema: Site
    consumers: [AC-001, AC-025]
    notes: |
      判重：名称完全一致，或 API 地址按归一化 key（忽略 scheme / 默认端口 /
      末尾斜杠 / 主机大小写）与已有站点相同，返回 409 并指出已有站点。

  - id: API-SITE-UPDATE
    path: /api/sites/{site_id}
    method: PATCH
    summary: 更新采集站
    request_schema: SitePatch
    response_schema: Site
    consumers: [AC-001]

  - id: API-SITE-DELETE
    path: /api/sites/{site_id}
    method: DELETE
    summary: 删除采集站（后台任务，接口立即返回）
    request_schema: null
    response_schema: OkResponse
    consumers: [AC-001, AC-035]
    notes: |
      空站点（无 video_cache / 无 aggregated_sources）直接删除，不等全局操作锁；
      有数据的站点排队等锁（最多 15 分钟），进度经 SSE site_delete_progress 推送
      （status: running/completed/failed + message）。同站删除在途时重复请求只执行一次。

  - id: API-SITE-PROBE
    path: /api/sites/{site_id}/probe
    method: POST
    summary: 探测站点连通性
    request_schema: null
    response_schema: ProbeResult
    consumers: [AC-001, AC-013]

  - id: API-SITE-BATCH-PROBE
    path: /api/sites/batch-probe
    method: POST
    summary: 批量嗅探新站点（探测成功自动添加并触发 lifecycle 全量）
    request_schema: "BatchProbeItem[]"
    response_schema: BatchProbeResponse
    consumers: [AC-025]
    notes: |
      单次最多 100 条，并发 5、单站 6 秒预算。判重：API 地址归一化（忽略 scheme /
      默认端口 / 末尾斜杠 / 主机大小写）+ 名称（完全一致或去图标/标点后一致）。
      跳过时结果 added=false 且 error 为「已存在：<站点名>」；探测失败不入库。

  # ═══════════════════════════════════════════════════════════════
  # 视频列表与搜索 (AC-003, AC-004)
  # ═══════════════════════════════════════════════════════════════
  - id: API-VIDEO-LIST
    path: /api/videos
    method: GET
    summary: 视频聚合列表（本地缓存）
    query_params:
      - name: t
        type: int | str
        required: false
      - name: pg
        type: int
        default: 1
      - name: h
        type: int
        required: false
      - name: by
        type: str
        required: false
      - name: category
        type: str
        required: false
      - name: mode
        type: str
        default: aggregated
        enum: [aggregated, source]
      - name: fields
        type: str
        required: false
        description: 逗号分隔的字段白名单，合法值 title,year,poster_url,sources
      - name: pg_size
        type: int
        required: false
        default: 20（桌面端）/ 12（移动端）
        description: 每页条数，最大 100
      - name: device
        type: str
        required: false
        enum: [mobile, desktop]
        description: 显式声明设备类型，用于分页默认值计算
    request_schema: null
    response_schema: AggregatedListResponse
    consumers: [AC-003, AC-023]
    notes: |
      [GAP-FIX-AC003] failed_sources 字段已废弃，响应中保留空数组以保证前向兼容，
      但在 data-schema 中标记为 deprecated，TDD 阶段由 backend agent 确保恒为空，
      并由 frontend agent 移除 FailedSourcesPanel 消费逻辑。

  - id: API-VIDEO-SEARCH
    path: /api/videos/search
    method: GET
    summary: 视频搜索（本地 LIKE）
    query_params:
      - name: wd
        type: str
        required: true
      - name: pg
        type: int
        default: 1
      - name: category
        type: str
        required: false
      - name: mode
        type: str
        default: aggregated
        enum: [aggregated, source]
      - name: fields
        type: str
        required: false
        description: 逗号分隔的字段白名单，合法值 title,year,poster_url,sources
      - name: pg_size
        type: int
        required: false
        default: 20（桌面端）/ 12（移动端）
        description: 每页条数，最大 100
      - name: device
        type: str
        required: false
        enum: [mobile, desktop]
        description: 显式声明设备类型，用于分页默认值计算
    request_schema: null
    response_schema: AggregatedListResponse
    consumers: [AC-004, AC-023]
    notes: |
      [GAP-FIX-AC004] 同 AC-003，failed_sources 已废弃。

  # ═══════════════════════════════════════════════════════════════
  # 视频详情 (AC-005)
  # ═══════════════════════════════════════════════════════════════
  - id: API-VIDEO-DETAIL
    path: /api/videos/detail
    method: POST
    summary: 视频详情（缓存优先，7天TTL）
    request_schema: DetailRequest
    response_schema: DetailResponse
    consumers: [AC-005]
    notes: |
      内部实时回源时产生的 failed_sources 不暴露给前端（502 时直接抛异常）。
      缓存 upsert 写入 VideoCache 表。

  # ═══════════════════════════════════════════════════════════════
  # 刮削管理 (AC-014)
  # ═══════════════════════════════════════════════════════════════
  - id: API-CRAWLER-STATUS
    path: /api/videos/crawler/status
    method: GET
    summary: 刮削器状态
    request_schema: null
    response_schema: CrawlerStatusResponse
    consumers: [AC-014]

  - id: API-CRAWLER-INCREMENTAL
    path: /api/videos/crawler/incremental/{site_id}
    method: POST
    summary: 手动触发站点增量更新
    request_schema: null
    response_schema: MessageResponse
    consumers: [AC-014]

  - id: API-VIDEOS-FILL-VIDEOLIST
    path: /api/videos/crawler/fill-videolist
    method: POST
    summary: 启动批量补全 videolist 后台任务（统计看板「批量补全」按钮）
    request_schema: FillVideolistRequest
    response_schema: FillVideolistResponse
    consumers: [AC-014]
    notes: |
      [FIX-FILL-PROGRESS] 立即返回 started + 当前 FillStatus 快照，任务在后台
      运行（全站实测 8–10 分钟），不阻塞 HTTP 请求。已有任务在运行时
      started=false，status 返回运行中任务的当前状态，不重复启动。
      补全完成后由后端自动刷新聚合缓存与统计，前端不在固定短延时后刷新。

  - id: API-VIDEOS-FILL-VIDEOLIST-STATUS
    path: /api/videos/crawler/fill-videolist/status
    method: GET
    summary: 查询批量补全 videolist 任务状态（运行期间轮询）
    request_schema: null
    response_schema: FillStatus
    consumers: [AC-014]
    notes: |
      旧客户端在 state=running 期间轮询本接口；新前端读取统一 detail.fill 任务。
      仅在任务进入终态后才刷新刮削统计。
      状态轻量持久化在 app_config（key=fill_videolist_status），不新增表；
      重启后遗留的 running 由启动流程改写为 interrupted。
      单站连续收到 HTTP 403 等封禁响应时该站熔断：site state=blocked，
      未处理条目计入 skipped，不再请求该站，其余站点照常补全。

  # 统一站点运维控制面；旧 crawler/cleanup 接口保留兼容
  - id: API-MAINTENANCE-OVERVIEW
    path: /api/maintenance/overview
    method: GET
    summary: 站点健康、补全缺口、刮削与调度总览
    request_schema: null
    response_schema: MaintenanceOverview
    consumers: [AC-013, AC-014]
    notes: 每站最新探测用 DISTINCT ON 一次查询，统计读取预计算缓存，不做整表 Python 聚合

  - id: API-MAINTENANCE-JOB-LIST
    path: /api/maintenance/jobs
    method: GET
    summary: 统一维护任务历史与活动任务
    query_params:
      - {name: limit, type: int, required: false, default: 30}
      - {name: active_only, type: bool, required: false, default: false}
    response_schema: MaintenanceJobOut[]
    consumers: [AC-014, AC-018]

  - id: API-MAINTENANCE-JOB-START
    path: /api/maintenance/jobs/{kind}
    method: POST
    summary: 提交全量/增量刮削、详情补全或失效资源清理
    request_schema: MaintenanceJobCreate
    response_schema: MaintenanceJobOut
    consumers: [AC-014]
    notes: kind 为 crawl.full/crawl.incremental/detail.fill/cache.cleanup；增量必须 site_id；活动任务去重返回同一 job id

  - id: API-MAINTENANCE-JOB-DETAIL
    path: /api/maintenance/jobs/{job_id}
    method: GET
    summary: 获取维护任务快照
    request_schema: null
    response_schema: MaintenanceJobOut
    consumers: [AC-014]
    notes: SSE maintenance_progress 只提示刷新，真实状态以本接口或列表快照为准

  - id: API-MAINTENANCE-JOB-CANCEL
    path: /api/maintenance/jobs/{job_id}/cancel
    method: POST
    summary: 在页或子批边界合作取消维护任务
    request_schema: null
    response_schema: MaintenanceJobOut
    consumers: [AC-014]

  - id: API-VIDEO-CACHE-CLEAR
    path: /api/videos/cache
    method: DELETE
    summary: 清空视频缓存
    request_schema: null
    response_schema: DeletedCountResponse
    consumers: [AC-014]
    notes: |
      [GAP-FIX-AC014] 所有写入 VideoCache 的操作（crawler upsert / detail upsert）
      需在事务中触发淘汰：若总行数 > 5000，按 cached_at ASC 删除最旧记录，
      直至剩余 5000 行。淘汰策略为写时触发（write-time eviction），
      不新增独立 API。

  # ═══════════════════════════════════════════════════════════════
  # 播放 (AC-006, AC-007)
  # ═══════════════════════════════════════════════════════════════
  - id: API-PLAY-EPISODES
    path: /api/play/episodes
    method: GET
    summary: 获取集数列表并解析 feifan/360zy
    query_params:
      - name: site_id
        type: int
        required: true
      - name: original_id
        type: str
        required: true
    request_schema: null
    response_schema: Episode[]
    consumers: [AC-006, AC-007]

  # ═══════════════════════════════════════════════════════════════
  # 下载 (AC-011, AC-012)
  # ═══════════════════════════════════════════════════════════════
  - id: API-DOWNLOAD-LIST
    path: /api/downloads
    method: GET
    summary: 下载任务列表
    request_schema: null
    response_schema: DownloadTaskOut[]
    consumers: [AC-011, AC-012]

  - id: API-DOWNLOAD-CREATE
    path: /api/downloads
    method: POST
    summary: 创建下载任务
    request_schema: DownloadTaskCreate
    response_schema: DownloadTaskOut
    consumers: [AC-011, AC-012]

  - id: API-DOWNLOAD-PAUSE
    path: /api/downloads/{task_id}/pause
    method: POST
    summary: 暂停下载任务
    request_schema: null
    response_schema: DownloadTaskOut
    consumers: [AC-011]

  - id: API-DOWNLOAD-RESUME
    path: /api/downloads/{task_id}/resume
    method: POST
    summary: 恢复下载任务
    request_schema: null
    response_schema: DownloadTaskOut
    consumers: [AC-011]

  - id: API-DOWNLOAD-DELETE
    path: /api/downloads/{task_id}
    method: DELETE
    summary: 删除下载任务
    query_params:
      - name: delete_file
        type: bool
        default: false
    request_schema: null
    response_schema: DeleteDownloadResponse
    consumers: [AC-011]

  # ═══════════════════════════════════════════════════════════════
  # 收藏 (AC-010)
  # ═══════════════════════════════════════════════════════════════
  - id: API-FAVORITE-LIST
    path: /api/favorites
    method: GET
    summary: 收藏列表
    request_schema: null
    response_schema: FavoriteOut[]
    consumers: [AC-010]

  - id: API-FAVORITE-ADD
    path: /api/favorites
    method: POST
    summary: 添加收藏
    request_schema: FavoriteIn
    response_schema: FavoriteOut
    consumers: [AC-010]

  - id: API-FAVORITE-DELETE
    path: /api/favorites/{fav_id}
    method: DELETE
    summary: 删除收藏
    request_schema: null
    response_schema: OkResponse
    consumers: [AC-010]

  # ═══════════════════════════════════════════════════════════════
  # 播放进度 (AC-009)
  # ═══════════════════════════════════════════════════════════════
  - id: API-PROGRESS-UPSERT
    path: /api/progress
    method: POST
    summary: 上报/更新播放进度
    request_schema: PlayProgressIn
    response_schema: PlayProgressOut
    consumers: [AC-009]

  - id: API-PROGRESS-RECENT
    path: /api/progress/recent
    method: GET
    summary: 最近播放记录
    request_schema: null
    response_schema: PlayProgressOut[]
    consumers: [AC-009]

  - id: API-PROGRESS-GET
    path: /api/progress
    method: GET
    summary: 查询单条播放进度
    query_params:
      - name: title
        type: str
        required: true
      - name: year
        type: int
        required: false
    request_schema: null
    response_schema: PlayProgressOut | null
    consumers: [AC-009]

  # ═══════════════════════════════════════════════════════════════
  # 设置 (AC-011 下载根目录)
  # ═══════════════════════════════════════════════════════════════
  - id: API-SETTINGS-DOWNLOAD-ROOT-GET
    path: /api/settings/download-root
    method: GET
    summary: 获取下载根目录
    request_schema: null
    response_schema: ValueResponse
    consumers: [AC-011]

  - id: API-SETTINGS-DOWNLOAD-ROOT-SET
    path: /api/settings/download-root
    method: PUT
    summary: 设置下载根目录
    request_schema: ValueRequest
    response_schema: ValueResponse
    consumers: [AC-011]

  # ═══════════════════════════════════════════════════════════════
  # SSE (AC-016)
  # ═══════════════════════════════════════════════════════════════
  - id: API-SSE
    path: /api/sse
    method: GET
    summary: SSE 实时推送流
    request_schema: null
    response_schema: text/event-stream
    consumers: [AC-016]
    event_types:
      - download_progress
      - download_status
      - site_health
    notes: 心跳间隔 30 秒，客户端自动重连 3 秒

  # ═══════════════════════════════════════════════════════════════
  # 健康检查 (AC-017)
  # ═══════════════════════════════════════════════════════════════
  - id: API-HEALTH
    path: /api/health
    method: GET
    summary: 服务健康检查
    request_schema: null
    response_schema: HealthResponse
    consumers: [AC-017]

# ═══════════════════════════════════════════════════════════════
# 共享 Schema 引用（详见 data-schema.yaml）
# ═══════════════════════════════════════════════════════════════
  # ═══════════════════════════════════════════════════════════════
  # 分类别名与系统分类
  # ═══════════════════════════════════════════════════════════════
  - id: API-CATEGORY-ALIAS-LIST
    path: /api/category-aliases
    method: GET
    summary: 别名列表（含来源条数与站点数）
    request_schema: null
    response_schema: CategoryAliasOut[]
    consumers: [AC-002]
    notes: 详情来自 SQL GROUP BY 聚合，服务端缓存 60s

  - id: API-CATEGORY-ALIAS-CREATE
    path: /api/category-aliases
    method: POST
    summary: 新增/修改别名
    request_schema: CategoryAliasIn
    response_schema: OkResponse
    consumers: [AC-002]
    notes: 先失效缓存再重算受影响视频

  - id: API-CATEGORY-ALIAS-UPDATE
    path: /api/category-aliases/{name_key}
    method: PUT
    summary: 修改别名目标分类
    request_schema: CategoryAliasUpdate
    response_schema: OkResponse
    consumers: [AC-002]

  - id: API-CATEGORY-ALIAS-DELETE
    path: /api/category-aliases/{name_key}
    method: DELETE
    summary: 删除别名
    request_schema: null
    response_schema: OkResponse
    consumers: [AC-002]

  - id: API-CATEGORY-ALIAS-UNMAPPED
    path: /api/category-aliases/unmapped
    method: GET
    summary: 未归类的远程类名
    request_schema: null
    response_schema: UnmappedCategoryOut[]
    consumers: [AC-002]

  - id: API-CATEGORY-ALIAS-ADOPT
    path: /api/category-aliases/adopt
    method: POST
    summary: 一键采纳未归类建议
    request_schema: AdoptAliasesRequest
    response_schema: OkResponse
    consumers: [AC-002]

  - id: API-CATEGORY-OVERRIDE-LIST
    path: /api/category-aliases/overrides
    method: GET
    summary: 站点例外列表
    request_schema: null
    response_schema: SiteOverrideOut[]
    consumers: [AC-002]

  - id: API-CATEGORY-OVERRIDE-SAVE
    path: /api/category-aliases/overrides
    method: POST
    summary: 新增站点例外
    request_schema: SiteOverrideIn
    response_schema: OkResponse
    consumers: [AC-002]

  - id: API-CATEGORY-OVERRIDE-DELETE
    path: /api/category-aliases/overrides
    method: DELETE
    summary: 删除站点例外
    request_schema: SiteOverrideIn
    response_schema: OkResponse
    consumers: [AC-002]

  - id: API-SYSTEM-CATEGORY-LIST
    path: /api/system-categories
    method: GET
    summary: 系统分类树
    request_schema: null
    response_schema: SystemCategoryOut[]
    consumers: [AC-002]

  - id: API-SYSTEM-CATEGORY-CREATE
    path: /api/system-categories
    method: POST
    summary: 新增系统分类
    request_schema: SystemCategoryCreate
    response_schema: SystemCategoryOut
    consumers: [AC-002]

  - id: API-SYSTEM-CATEGORY-UPDATE
    path: /api/system-categories/{category_id}
    method: PATCH
    summary: 修改系统分类
    request_schema: SystemCategoryUpdate
    response_schema: SystemCategoryOut
    consumers: [AC-002]

  - id: API-SYSTEM-CATEGORY-DELETE
    path: /api/system-categories/{category_id}
    method: DELETE
    summary: 删除系统分类（含子类；不迁移，相关视频直接变未分类）
    request_schema: null
    response_schema: OkResponse
    consumers: [AC-002]
    notes: 删除挂载关系 + 将相关视频 system_category 置 NULL，不重新投票；返回 links_removed/videos_reset

  # ═══════════════════════════════════════════════════════════════
  # 视频列表增强
  # ═══════════════════════════════════════════════════════════════
  - id: API-VIDEO-RECOMMENDED
    path: /api/videos/recommended
    method: GET
    summary: 首页推荐列表
    request_schema: null
    response_schema: AggregatedListResponse
    consumers: [AC-003]
    notes: 读 recommended_videos，60s 缓存

  - id: API-VIDEO-CATEGORY-STATS
    path: /api/videos/categories/stats
    method: GET
    summary: 分类计数（含 0 内容分类；另返回未分类数）
    request_schema: null
    response_schema: CategoryStat[]
    consumers: [AC-003]
    notes: 60s 缓存；禁用站点内容不计入；前端分类栏据此弱化 0 内容分类

  # ═══════════════════════════════════════════════════════════════
  # 播放
  # ═══════════════════════════════════════════════════════════════
  - id: API-PLAY-SOURCES
    path: /api/play/sources
    method: GET
    summary: 播放源列表
    request_schema: null
    response_schema: SourceDetail[]
    consumers: [AC-007]

  - id: API-PLAY-SOURCES-ANALYZE
    path: /api/play/sources/analyze
    method: POST
    summary: 按需分析当前视频的来源媒体参数
    request_schema: AnalyzeSourcesIn
    response_schema: PlaySourcesResponse
    consumers: [AC-007, AC-008]
    notes: 打开详情后自动逐批调用；全局串行，每次最多 2 个来源；offset/next_offset 保证缓存命中仍前进；不下载未选源的视频分片

  - id: API-PLAY-HEARTBEAT
    path: /api/play/heartbeat
    method: POST
    summary: 播放会话心跳，触发后台任务退让
    request_schema: PlaybackHeartbeatIn
    response_schema: null
    consumers: [AC-008]

  - id: API-PLAY-ENHANCE-CAPABILITY
    path: /api/play/enhance/capability
    method: GET
    summary: 查询本机轻量画质增强能力
    request_schema: null
    response_schema: EnhancementCapability
    consumers: [AC-008]

  - id: API-PLAY-ENHANCE-START
    path: /api/play/enhance
    method: POST
    summary: 为当前选中来源启动 Lanczos + 轻度锐化转码
    request_schema: EnhancePlaybackIn
    response_schema: EnhancementStartResponse
    consumers: [AC-008]
    notes: 单进程、单线程、实时读取；ffmpeg 不可用时返回 503

  - id: API-PLAY-ENHANCE-FILE
    path: /api/play/enhance/{session_id}/{filename}
    method: GET
    summary: 读取当前增强会话的 playlist 或分片
    request_schema: null
    response_schema: null
    consumers: [AC-008]

  - id: API-PLAY-ENHANCE-STOP
    path: /api/play/enhance/{session_id}
    method: DELETE
    summary: 停止增强并清理临时文件
    request_schema: null
    response_schema: null
    consumers: [AC-008]

  - id: API-PLAY-PROXY-M3U8
    path: /api/play/proxy-m3u8
    method: GET
    summary: m3u8 去广告代理
    request_schema: null
    response_schema: null
    consumers: [AC-008]
    notes: 返回 text/plain

  # ═══════════════════════════════════════════════════════════════
  # 站点增强
  # ═══════════════════════════════════════════════════════════════
  - id: API-SITE-PROBE-BATCH
    path: /api/sites/probe-batch
    method: POST
    summary: 批量探测站点，逐站流式返回结果
    request_schema: ProbeSitesBatchRequest
    response_schema: SiteProbeResult
    consumers: [AC-013]
    notes: 返回 application/x-ndjson；每行一个站点检测结果，客户端可逐行更新；离开页面可中止请求

  - id: API-SITE-EXPORT
    path: /api/sites/export
    method: GET
    summary: 导出站点配置
    request_schema: null
    response_schema: SiteExportOut
    consumers: [AC-001]

  - id: API-SITE-IMPORT
    path: /api/sites/import
    method: POST
    summary: 导入站点配置
    request_schema: SiteImportIn
    response_schema: SiteImportResult
    consumers: [AC-001]

  - id: API-CATEGORY-SETTINGS-OVERVIEW
    path: /api/category-settings/overview
    method: GET
    summary: 系统分类树（videos/remotes 计数）与未挂载/未分类汇总
    request_schema: null
    response_schema: null
    consumers: [AC-002]

  - id: API-CATEGORY-SETTINGS-REMOTES
    path: /api/category-settings/remotes
    method: GET
    summary: 各站点远程分类快照（挂载状态、来源数、样例、stale）
    request_schema: null
    response_schema: null
    consumers: [AC-002]

  - id: API-CATEGORY-SETTINGS-LINKS-CREATE
    path: /api/category-settings/links
    method: POST
    summary: 批量挂载入队（立即返回 202，由后端队列串行执行）
    request_schema: null
    response_schema: null
    consumers: [AC-002]
    notes: |
      只写入 category_link_jobs，不在 HTTP 请求里重算；返回 job_id/state。
      后台工作协程串行执行，支持 GET /jobs/{job_id} 轮询。
      只能挂小类；(site_id, remote_id) 唯一；校验/执行失败写入 job.error。

  - id: API-CATEGORY-SETTINGS-JOB
    path: /api/category-settings/jobs/{job_id}
    method: GET
    summary: 查询分类挂载队列任务状态
    request_schema: null
    response_schema: null
    consumers: [AC-002]

  - id: API-CATEGORY-SETTINGS-QUEUE
    path: /api/category-settings/queue
    method: GET
    summary: 后端分类挂载队列 queued/running 计数
    request_schema: null
    response_schema: null
    consumers: [AC-002]

  - id: API-CATEGORY-SETTINGS-LINKS-DELETE
    path: /api/category-settings/links
    method: DELETE
    summary: 批量解除远程分类挂载
    request_schema: null
    response_schema: null
    consumers: [AC-002]
    notes: 删除后只重算受影响视频，不做全量回填

  - id: API-CATEGORY-SETTINGS-REFRESH
    path: /api/category-settings/refresh
    method: POST
    summary: 重新拉取所有站点的远程分类快照
    request_schema: null
    response_schema: null
    consumers: [AC-002]

  - id: API-CATEGORY-SETTINGS-SITE-REFRESH
    path: /api/category-settings/sites/{site_id}/refresh
    method: POST
    summary: 重新拉取单个站点的远程分类快照
    request_schema: null
    response_schema: null
    consumers: [AC-002]

  - id: API-FAVORITE-STATUS
    path: /api/favorites/status
    method: GET
    summary: 查询某标题是否已收藏
    request_schema: null
    response_schema: FavoriteStatusOut
    consumers: [AC-010]

  # ═══════════════════════════════════════════════════════════════
  # 分类设置 / 清除失效资源 / 播放加速（2026-11）
  # ═══════════════════════════════════════════════════════════════
  - id: API-VIDEOS-CLEANUP-START
    path: /api/videos/cleanup-expired
    method: POST
    summary: 启动全站失效资源清理后台任务
    query_params:
      - name: site_id
        type: int
        required: false
      - name: speed
        type: string
        required: false
        description: eco / normal / fast，默认 eco
      - name: dry_run
        type: bool
        required: false
    response_schema: null
    consumers: []
    notes: 立即返回；连续两轮缺失才删除；游标存 app_config 断点续跑

  - id: API-VIDEOS-CLEANUP-STATUS
    path: /api/videos/cleanup-expired/status
    method: GET
    summary: 清理进度（站点数、已检查、已删除、待确认、ETA）
    request_schema: null
    response_schema: null
    consumers: []
    notes: 旧客户端兼容接口；新前端读取 cache.cleanup 任务的 details.cleanup

  - id: API-VIDEOS-CLEANUP-CANCEL
    path: /api/videos/cleanup-expired/cancel
    method: POST
    summary: 停止清理任务并保留游标
    request_schema: null
    response_schema: null
    consumers: []
    notes: 在批次之间检查取消标记

  - id: API-PLAY-ACCEL-M3U8
    path: /api/play/accel/m3u8
    method: GET
    summary: 播放加速：改写 playlist 分片地址为后端代理
    query_params:
      - name: site_id
        type: int
        required: true
      - name: url
        type: string
        required: true
    request_schema: null
    response_schema: null
    consumers: []
    notes: 仅在播放加速开启时可用；master playlist 递归改写变体

  - id: API-PLAY-ACCEL-SEGMENT
    path: /api/play/accel/segment
    method: GET
    summary: 播放加速：分片代理（并发预取 + LRU 缓存 + Range 透传）
    query_params:
      - name: pl
        type: string
        required: true
      - name: i
        type: int
        required: true
    request_schema: null
    response_schema: null
    consumers: []
    notes: 缓存 300MB / 10 分钟；同一分片在途去重

  - id: API-SETTINGS-STREAM-ACCEL-GET
    path: /api/settings/stream-accel
    method: GET
    summary: 读取播放加速开关与档位
    request_schema: null
    response_schema: null
    consumers: []
    notes: 默认关闭、二档

  - id: API-SETTINGS-STREAM-ACCEL-SET
    path: /api/settings/stream-accel
    method: PUT
    summary: 保存播放加速开关与档位
    request_schema: null
    response_schema: null
    consumers: []
    notes: 档位 1/2/3/4 → 2/4/8/16 并发

  - id: API-SETTINGS-PLAYBACK-FEATURES-GET
    path: /api/settings/playback-features
    method: GET
    summary: 读取按需画质分析、播放保护与轻量增强开关
    request_schema: null
    response_schema: PlaybackFeatureSettings
    consumers: [AC-008]

  - id: API-SETTINGS-PLAYBACK-FEATURES-SET
    path: /api/settings/playback-features
    method: PUT
    summary: 保存播放与画质功能开关
    request_schema: PlaybackFeatureChanges
    response_schema: PlaybackFeatureSettings
    consumers: [AC-008]
    notes: 增强需要 ffmpeg；三个设置共享给详情和播放页


